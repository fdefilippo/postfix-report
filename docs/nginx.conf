#
# Nginx: include INSIDE an existing HTTPS server block.
# Replace reports.example.org with your external hostname in config.yaml:
# web:
#   listen: 127.0.0.1:8080
#   prefix: /postfix-report/
#   public_origin: https://reports.example.org
# If using another backend port (e.g. 3080), change it here AND in web.listen.
# Prepare data with update, then start postfix-report-web.service.
# Replace any existing static alias location for this prefix.
#
# Create an htpasswd file outside the web root, readable by Nginx:
#   htpasswd -c /etc/nginx/postfix-report.htpasswd reportuser
# Use -c only when creating the file, otherwise existing users are removed.
# Check the complete server configuration with nginx -t.
# For Zimbra use its own nginx binary/config and supported reload procedure.
# Setup and SELinux considerations: EXPORTS.md.
# Reference: https://nginx.org/en/docs/http/ngx_http_proxy_module.html

location = /postfix-report {
    return 301 /postfix-report/;
}

location ^~ /postfix-report/ {
    auth_basic "Postfix report";
    auth_basic_user_file /etc/nginx/postfix-report.htpasswd;
    client_max_body_size 1k;

    # No trailing slash or URI: preserve /postfix-report/ on the backend.
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization $http_authorization;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
    proxy_send_timeout 15s;
    proxy_cache off;
    # Keep private document downloads out of proxy temporary files.
    proxy_buffering off;

    # Authentication covers dashboards, scripts, API requests and downloads.
    # Preserve the daemon's CSP and private, no-store response headers.
    # Do not add connect-src 'none': it blocks export APIs.
}
