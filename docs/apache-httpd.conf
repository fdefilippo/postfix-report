# Apache HTTPD 2.4: include INSIDE an existing HTTPS VirtualHost.
# Requires mod_proxy, mod_proxy_http, mod_alias, mod_auth_basic,
# mod_authn_file and mod_authz_user (plus mod_ssl for the HTTPS VirtualHost).
# Replace reports.example.org with your external hostname in config.yaml:
# web:
#   listen: 127.0.0.1:8080
#   prefix: /postfix-report/
#   public_origin: https://reports.example.org
# If using another backend port (e.g. 3080), change it here AND in web.listen.
# Prepare data with update, then start postfix-report-web.service.
# Replace any existing static Alias profile for this prefix.
#
# Create an htpasswd file outside the web root, readable by Apache:
#   htpasswd -c /etc/httpd/postfix-report.htpasswd reportuser
# On Debian/Ubuntu use e.g. /etc/apache2/postfix-report.htpasswd below.
# Use -c only when creating the file, otherwise existing users are removed.
# Check the complete server configuration with apachectl configtest.
# Setup and SELinux considerations: EXPORTS.md.
# Reference: https://httpd.apache.org/docs/2.4/mod/mod_proxy.html

RedirectMatch 301 "^/postfix-report$" "/postfix-report/"
ProxyRequests Off
ProxyPreserveHost On
ProxyPass        /postfix-report/ http://127.0.0.1:8080/postfix-report/ connectiontimeout=5 timeout=35
ProxyPassReverse /postfix-report/ http://127.0.0.1:8080/postfix-report/

<Location /postfix-report/>
    AuthType Basic
    AuthName "Postfix report"
    AuthBasicProvider file
    AuthUserFile /etc/httpd/postfix-report.htpasswd
    Require valid-user
    LimitRequestBody 1024
</Location>

# Authentication covers dashboards, scripts, API requests and downloads.
# Apache forwards Authorization by default: do not remove that header.
# Preserve the daemon's CSP and private, no-store response headers.
# Do not add the static profile's connect-src 'none': it blocks export APIs.
