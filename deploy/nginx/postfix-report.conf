# nginx — da includere in un blocco server {} con TLS.
# Credenziali: htpasswd -c /etc/nginx/postfix-report.htpasswd utente
location /postfix-report/ {
    alias /var/www/html/postfix-report/;
    index index.html;
    autoindex off;
    auth_basic "Postfix report";
    auth_basic_user_file /etc/nginx/postfix-report.htpasswd;
    # allow 10.0.0.0/8; deny all;
    location ~ /\. { deny all; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-ancestors 'none'" always;
}
