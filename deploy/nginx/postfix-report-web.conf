# Include in a TLS server block. Configure web.prefix: /postfix-report/ and
# web.public_origin: https://reports.example.org (the real external origin).
# This replaces the static alias location when using serve.
location /postfix-report/ {
    auth_basic "Postfix report";
    auth_basic_user_file /etc/nginx/postfix-report.htpasswd;
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 35s;
    proxy_send_timeout 15s;
    # serve sets CSP including connect-src 'self'; do not append the static
    # profile's connect-src 'none', which would block export jobs.
}
