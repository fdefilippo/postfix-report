# Apache 2.4 — pubblicazione dei report con autenticazione.
# I report contengono dati di traffico: non pubblicarli senza controllo accessi.
# Creare le credenziali: htpasswd -c /etc/httpd/postfix-report.htpasswd utente
Alias /postfix-report /var/www/html/postfix-report
<Directory /var/www/html/postfix-report>
    Options -Indexes -FollowSymLinks
    AllowOverride None
    AuthType Basic
    AuthName "Postfix report"
    AuthUserFile /etc/httpd/postfix-report.htpasswd
    <RequireAll>
        Require valid-user
        # Restringere anche per rete, se possibile:
        # Require ip 10.0.0.0/8
    </RequireAll>
    # File temporanei della scrittura atomica (normalmente assenti).
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    Header always set X-Content-Type-Options nosniff
    Header always set Referrer-Policy no-referrer
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-ancestors 'none'"
</Directory>
