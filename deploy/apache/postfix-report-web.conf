# Include in a TLS VirtualHost; requires proxy, proxy_http and auth_basic.
# Configure web.prefix: /postfix-report/ and web.public_origin with the real
# external origin. Replaces the static Alias profile.
ProxyPreserveHost On
ProxyPass /postfix-report/ http://127.0.0.1:8080/postfix-report/ timeout=35
ProxyPassReverse /postfix-report/ http://127.0.0.1:8080/postfix-report/
<Location /postfix-report/>
    AuthType Basic
    AuthName "Postfix report"
    AuthUserFile /etc/httpd/postfix-report.htpasswd
    Require valid-user
</Location>
